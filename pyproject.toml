[project]
name = "asa-path-planning"
version = "0.1.0"
description = "ASA robot path-planning experiment comparing Brute Force, UCS, GBFS, A*, and RRT*."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "nbconvert>=7.16",
    "pandas>=2.2",
]

[project.scripts]
asa-path-planning = "asa_path_planning.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asa_path_planning"]
